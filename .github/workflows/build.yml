name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex:
    name: XeLaTeX
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make \
            curl \
            fontconfig \
            poppler-utils \
            ripgrep \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-chinese

      - name: Validate source
        run: make lint

      - name: Fetch local-use assets
        run: make setup

      - name: Build resume
        run: make

      - name: Validate PDF
        run: make test

      - name: Scan LaTeX log
        run: |
          set +e
          rg -n "^!|Error:|Class .*Warning|Package .* Error|LaTeX .*Warning|Package .*Warning|Overfull|Underfull|undefined|Unknown CJK|Missing character" resume.log
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Inspect PDF
        run: |
          test -s resume.pdf
          pdfinfo resume.pdf
          pdffonts resume.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkumo-resume
          path: resume.pdf
